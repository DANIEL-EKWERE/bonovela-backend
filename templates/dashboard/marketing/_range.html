<form method="get">{% for k, v in request.GET.items %}{% if k != 'days' %}<input type="hidden" name="{{ k }}" value="{{ v }}">{% endif %}{% endfor %}
  <select name="days" onchange="this.form.submit()" style="width:auto;min-width:150px">{% for d, label in ranges %}<option value="{{ d }}" {% if d == days %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>
</form>

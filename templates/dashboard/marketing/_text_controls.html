<div class="m-two"><label class="f-field"><span>Colour</span><input type="color" data-k="{{ k }}.color"></label>
  <label class="f-field"><span>Size</span><input type="range" min="9" max="44" data-k="{{ k }}.size"></label></div>
<div class="m-two"><label class="f-field"><span>Style</span><select data-k="{{ k }}.font"><option value="sans">Modern</option><option value="serif">Classic serif</option><option value="script">Script</option></select></label>
  <label class="f-field"><span>Weight</span><select data-k="{{ k }}.weight"><option value="400">Regular</option><option value="600">Semi-bold</option><option value="700">Bold</option><option value="800">Extra bold</option></select></label></div>
<label class="f-field"><span>Alignment</span><select data-k="{{ k }}.align"><option value="left">Left</option><option value="center">Centre</option><option value="right">Right</option></select></label>
<small style="color:var(--f-muted)">The text comes from Headline / Subtitle on the left.</small>

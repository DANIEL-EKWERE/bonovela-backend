<!doctype html>
<html><body style="margin:0;padding:24px 12px;background:#FDF2F5;font-family:Arial,Helvetica,sans-serif;color:#2B1E20">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:540px;background:#ffffff;border-radius:18px;border:1px solid #F6D9E2">
  <tr><td align="center" style="padding:26px 24px 8px">
    <img src="{{ logo_url }}" alt="Bonovela" width="220" style="display:block;width:220px;max-width:75%;height:auto">
  </td></tr>
  <tr><td style="padding:0 24px"><div style="border-top:1px solid #F6D9E2"></div></td></tr>
  <tr><td style="padding:22px 26px 8px;font-size:15px;line-height:1.6">{% block body %}{% endblock %}</td></tr>
  {% if button_url %}<tr><td style="padding:8px 26px 24px"><a href="{{ button_url }}" style="display:block;text-align:center;background:#A3284F;color:#ffffff;text-decoration:none;font-size:16px;letter-spacing:1px;padding:15px;border-radius:12px">{{ button_label }}</a></td></tr>{% endif %}
  <tr><td align="center" style="padding:0 24px 22px;color:#9B8A8E;font-size:12px">This email was sent by Bonovela (noreply@bonovela.com).{% if reply_note %} {{ reply_note }}{% endif %}<br>Questions? <a href="mailto:support@bonovela.com" style="color:#A3284F">support@bonovela.com</a></td></tr>
</table>
</td></tr></table>
</body></html>

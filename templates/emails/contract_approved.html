<!doctype html>
<html><body style="margin:0;padding:24px 12px;background:#FDF2F5;font-family:Arial,Helvetica,sans-serif;color:#2B1E20">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:18px;border:1px solid #F6D9E2">
  <tr><td align="center" style="padding:26px 24px 8px">
    <img src="{{ logo_url }}" alt="Bonovela" width="240" style="display:block;width:240px;max-width:80%;height:auto">
    <div style="font-size:13px;letter-spacing:2px;color:#9B6A7A;margin-top:6px">STORIES THAT STAY WITH YOU</div>
  </td></tr>
  <tr><td style="padding:0 24px"><div style="border-top:1px solid #F6D9E2"></div></td></tr>
  <tr><td align="center" style="padding:22px 24px 6px">
    <span style="display:inline-block;background:#DDF5E6;color:#18804A;font-weight:bold;font-size:13px;letter-spacing:1px;padding:6px 16px;border-radius:999px">CONTRACT APPROVED</span>
    <h1 style="color:#A3284F;font-size:30px;margin:16px 0 8px">Congratulations!</h1>
    <p style="font-size:16px;line-height:1.5;margin:0;color:#5A4448">Your contract has been approved for a Bonovela publishing contract.</p>
  </td></tr>
  <tr><td style="padding:18px 24px">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FFF2F6;border-radius:14px">
      <tr><td colspan="2" style="padding:16px 18px 4px;color:#A3284F;font-weight:bold;font-size:14px;letter-spacing:1px">BOOK INFORMATION</td></tr>
      <tr><td colspan="2" style="padding:4px 18px 10px;font-size:22px;font-weight:bold">{{ title }}</td></tr>
      <tr><td style="padding:6px 18px;color:#7A6468;font-size:14px">Author</td><td align="right" style="padding:6px 18px;font-weight:bold">{{ author }}</td></tr>
      <tr><td style="padding:6px 18px;color:#7A6468;font-size:14px">Contract</td><td align="right" style="padding:6px 18px;font-weight:bold">{{ contract }}</td></tr>
      <tr><td style="padding:6px 18px 16px;color:#7A6468;font-size:14px">Editor</td><td align="right" style="padding:6px 18px 16px;font-weight:bold">{{ editor }}</td></tr>
    </table>
  </td></tr>
  <tr><td style="padding:0 24px 10px"><a href="{{ contract_url }}" style="display:block;text-align:center;background:#A3284F;color:#ffffff;text-decoration:none;font-size:16px;letter-spacing:1px;padding:15px;border-radius:12px">VIEW CONTRACT</a></td></tr>
  <tr><td style="padding:0 24px 24px"><a href="{{ dashboard_url }}" style="display:block;text-align:center;border:1px solid #E7B7C6;color:#A3284F;text-decoration:none;font-size:15px;letter-spacing:1px;padding:13px;border-radius:12px">AUTHOR DASHBOARD</a></td></tr>
  <tr><td align="center" style="padding:0 24px 22px;color:#9B8A8E;font-size:12px">Questions? Email <a href="mailto:support@bonovela.com" style="color:#A3284F">support@bonovela.com</a></td></tr>
</table>
</td></tr></table>
</body></html>
